name: Build & Deploy (develop)

on:
  push:
    branches: ["develop"]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # needed to push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}   # e.g. ghcr.io/owner/repo
  TAG: ${{ github.sha }}
  ANSIBLE_DIR: ansible

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:dev-latest

  deploy:
    name: Ansible Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible + collections (community)
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.16.*"
          ansible-galaxy collection install "community.docker:>=3.0.0,<4.0.0"
          ansible-galaxy collection install "community.general:>=9.0.0,<10.0.0"

      - name: Prepare SSH (write key, add host)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Prefer base64 secret if provided; else fall back to plaintext secret
          if [ -n "${{ secrets.DEV_SSH_PRIVATE_KEY_B64 || '' }}" ]; then
            echo "Using base64-encoded private key from DEV_SSH_PRIVATE_KEY_B64"
            printf '%s' "${{ secrets.DEV_SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/id_rsa || {
              echo "::error::Failed to decode DEV_SSH_PRIVATE_KEY_B64"; exit 1; }
          elif [ -n "${{ secrets.DEV_SSH_PRIVATE_KEY || '' }}" ]; then
            echo "Using plaintext private key from DEV_SSH_PRIVATE_KEY"
            printf '%s\n' "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            sed -i 's/\r$//' ~/.ssh/id_rsa
          else
            echo "::error::No SSH key provided. Set DEV_SSH_PRIVATE_KEY_B64 (preferred) or DEV_SSH_PRIVATE_KEY"
            exit 1
          fi

          chmod 600 ~/.ssh/id_rsa

          # Sanity checks (do NOT print the key)
          echo "Key file size (bytes): $(wc -c < ~/.ssh/id_rsa)"
          head -n1 ~/.ssh/id_rsa | sed 's/./*/g' || true
          if ! head -n1 ~/.ssh/id_rsa | grep -Eq 'BEGIN (OPENSSH|RSA) PRIVATE KEY'; then
            echo "::warning::Unexpected private key header."
          fi

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_SSH_PORT }}"
          : "${HOST:?DEV_HOST secret missing}"
          : "${PORT:?DEV_SSH_PORT secret missing}"

          # Add host keys (IPv4 then IPv6)
          ssh-keyscan -4 -T 10 -p "$PORT" -t rsa,ecdsa,ed25519 "$HOST" 2>/dev/null >> ~/.ssh/known_hosts || true
          ssh-keyscan -6 -T 10 -p "$PORT" -t rsa,ecdsa,ed25519 "$HOST" 2>/dev/null >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts

      - name: Write Ansible vault password
        run: |
          echo "${{ secrets.DEV_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Connectivity diagnostics
        shell: bash
        run: |
          set -x
          echo "HOST=${{ secrets.DEV_HOST }}"
          echo "PORT=${{ secrets.DEV_SSH_PORT }}"
          getent hosts "${{ secrets.DEV_HOST }}" || true
          (command -v nc >/dev/null && nc -vz -w 10 "${{ secrets.DEV_HOST }}" "${{ secrets.DEV_SSH_PORT }}") || true
          timeout 5 bash -lc 'cat </dev/null > /dev/tcp/${{ secrets.DEV_HOST }}/${{ secrets.DEV_SSH_PORT }}' && echo RAW_TCP_OK || echo RAW_TCP_FAIL

      - name: Smoke test SSH as deploy (force IPv4 and key only)
        shell: bash
        run: |
          set -euo pipefail
          ssh -4 -vvv \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_rsa \
            -p "${{ secrets.DEV_SSH_PORT }}" \
            deploy@${{ secrets.DEV_HOST }} 'echo SSH_OK'

      # ---- IMPORTANT: install your local collection from the repo ----
      - name: Install local collection "maticsusnik.common" from repo
        working-directory: ${{ env.ANSIBLE_DIR }}
        run: |
          set -euo pipefail
          # Install collection from 'ansible/' (must contain galaxy.yml)
          mkdir -p collections
          ansible-galaxy collection install . -p ./collections --force
          echo "=== Installed collections at ./collections ==="
          ansible-galaxy collection list -p ./collections || true
          echo "=== Sanity check for role path ==="
          find ./collections -type d -path "*/ansible_collections/maticsusnik/common/roles/shopware" -print

      - name: Deploy via Ansible (use deploy user + key)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          # Use the singular var; value must be the parent dir that contains 'ansible_collections/'
          ANSIBLE_COLLECTIONS_PATH: "${{ github.workspace }}/ansible/collections:/home/runner/.ansible/collections:/usr/share/ansible/collections"
          # Enforce our SSH options
          ANSIBLE_SSH_ARGS: "-o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/id_rsa -p ${{ secrets.DEV_SSH_PORT }}"
        run: |
          ansible-playbook shopware.yaml \
            -i inventory/hosts.yaml \
            -l shopware_development \
            -u deploy \
            --diff \
            --extra-vars "shopware_docker_image_tag=${{ github.sha }}" \
            --vault-password-file ../.vault_pass

      - name: Clean up vault file
        if: always()
        run: rm -f .vault_pass
