name: Build & Deploy (develop)

on:
  push:
    branches: ["develop"]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # needed to push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}   # e.g. ghcr.io/maticsusnik/shopware-sivanka
  TAG: ${{ github.sha }}
  ANSIBLE_DIR: ansible

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:dev-latest

  deploy:
    name: Ansible Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible + collections
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.16.*"
          ansible-galaxy collection install "community.docker:>=3.0.0,<4.0.0"
          ansible-galaxy collection install "community.general:>=9.0.0,<10.0.0"

      - name: Prepare SSH (write key, add host)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf "%s" "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          HOST="${{ secrets.DEV_HOST }}"
          PORT="${{ secrets.DEV_SSH_PORT }}"
          : "${HOST:?DEV_HOST secret missing}"
          : "${PORT:?DEV_SSH_PORT secret missing}"

          # add host key (try IPv4 then IPv6; don't fail here)
          ssh-keyscan -4 -T 10 -p "$PORT" -t rsa,ecdsa,ed25519 "$HOST" 2>/dev/null >> ~/.ssh/known_hosts || true
          ssh-keyscan -6 -T 10 -p "$PORT" -t rsa,ecdsa,ed25519 "$HOST" 2>/dev/null >> ~/.ssh/known_hosts || true

      - name: Write Ansible vault password
        run: |
          echo "${{ secrets.DEV_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Connectivity diagnostics
        shell: bash
        run: |
          set -x
          echo "HOST=${{ secrets.DEV_HOST }}"
          echo "PORT=${{ secrets.DEV_SSH_PORT }}"
          getent hosts "${{ secrets.DEV_HOST }}" || true
          (command -v nc >/dev/null && nc -vz -w 10 "${{ secrets.DEV_HOST }}" "${{ secrets.DEV_SSH_PORT }}") || true
          timeout 5 bash -lc 'cat </dev/null > /dev/tcp/${{ secrets.DEV_HOST }}/${{ secrets.DEV_SSH_PORT }}' && echo RAW_TCP_OK || echo RAW_TCP_FAIL

      - name: Smoke test SSH as deploy (force IPv4)
        run: |
          ssh -4 -v -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -p "${{ secrets.DEV_SSH_PORT }}" \
              -i ~/.ssh/id_rsa \
              deploy@${{ secrets.DEV_HOST }} 'echo SSH_OK'

      - name: Deploy via Ansible (use deploy user + key)
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: |
          ansible-playbook shopware.yaml \
            -i inventory/hosts.yaml \
            -l shopware_development \
            -u deploy \
            --private-key ~/.ssh/id_rsa \
            -e ansible_port=${{ secrets.DEV_SSH_PORT }} \
            --diff \
            --extra-vars "shopware_docker_image_tag=${{ github.sha }}" \
            --vault-password-file ../.vault_pass

      - name: Clean up vault file
        if: always()
        run: rm -f .vault_pass
