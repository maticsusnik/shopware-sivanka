; Local development
expose_php = Off
zend.assertions = -1
zend.detect_unicode = 0

memory_limit = 1024M

opcache.enable = 1
opcache.jit = disable
opcache.interned_strings_buffer = 32
opcache.memory_consumption = 512
opcache.max_accelerated_files = 32531
; Dev needs timestamp validation, which means a cache:clear invalidates
; thousands of entries at once - hence the generous sizing above.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; file_exists()/is_readable() answered from OPcache goes stale while
; cache:clear deletes those very files, so keep the override off in dev.
opcache.enable_file_override = 0
; No secondary file cache in dev: sources change constantly and it only adds
; another moving part to the invalidation storm.
opcache.file_cache =
opcache.file_cache_only = 0
; Uncomment to log OPcache restarts (useful when diagnosing a crash).
;opcache.log_verbosity_level = 2

realpath_cache_size = 16M
realpath_cache_ttl = 3600

max_execution_time = 300
upload_max_filesize = 128M
post_max_size = 128M
