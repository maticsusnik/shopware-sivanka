; Xdebug - local development only (the extension is installed only when
; DOCKER_IMAGE_EXTRAS="-dev", so dev/prod images never load it).
;
; Off by default on purpose: Xdebug installs execution/GC hooks in every PHP
; thread of the FrankenPHP (ZTS) process, and it is a documented amplifier of
; "zend_mm_heap corrupted" / SIGSEGV crashes in threaded SAPIs. With mode=debug
; it also opens a TCP connection to the IDE on *every* request, even when no
; IDE is listening.
;
; To debug, set XDEBUG_MODE in .docker.env (the env var takes precedence over
; this file) and restart the container:
;   XDEBUG_MODE=debug        # or: develop,debug / profile / trace
; Then start the session per request instead of globally:
;   - PhpStorm "Start Listening" + the browser Xdebug helper extension, or
;   - append ?XDEBUG_TRIGGER=1, or set the XDEBUG_TRIGGER cookie/env.
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.idekey = PHPSTORM
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = 0
